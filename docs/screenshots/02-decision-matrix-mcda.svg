<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0f172a" flood-opacity="1" />
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#0f172a" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <circle cx="28" cy="30" r="6" fill="#ef4444" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="48" cy="30" r="6" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="68" cy="30" r="6" fill="#10b981" stroke="#0f172a" stroke-width="1.5" />
  
  <g transform="translate(100, 16)">
    <rect x="0" y="0" width="36" height="28" rx="6" fill="#6366f1" stroke="#0f172a" stroke-width="2" />
    <text x="18" y="20" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>
    <text x="46" y="20" font-size="16" font-weight="900" fill="#0f172a">RICHA</text>
    <text x="108" y="20" font-size="11" font-weight="700" fill="#d97706">DECISION MATRIX &amp; ADVISOR</text>
  </g>

  <!-- Navigation Tab Bar with Tab 3 Active -->
  <rect x="0" y="60" width="1200" height="48" fill="#ffffff" stroke="#0f172a" stroke-width="1" />
  <g transform="translate(24, 70)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="55" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1. Bento Hub</text>

    <rect x="120" y="0" width="110" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="175" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">2. 4D Triage</text>

    <!-- Tab 3 Active: Decision Matrix -->
    <rect x="240" y="0" width="135" height="28" rx="6" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5" />
    <text x="307" y="18" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">⚖️ 3. Decision Matrix</text>

    <rect x="385" y="0" width="105" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="437" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">4. Life Admin</text>

    <rect x="500" y="0" width="115" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="557" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">5. Sensory Reset</text>

    <rect x="625" y="0" width="125" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="687" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">6. Socratic Hearth</text>

    <rect x="760" y="0" width="110" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="815" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">7. Kanban Flow</text>

    <rect x="880" y="0" width="105" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="932" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">8. Bullet Log</text>
  </g>

  <!-- WORKSPACE CONTENT -->

  <!-- Top Dilemma Card -->
  <g transform="translate(24, 126)">
    <rect x="0" y="0" width="1152" height="108" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow)" />
    <g transform="translate(20, 18)">
      <rect x="0" y="0" width="190" height="22" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <text x="95" y="15" font-size="10" font-weight="900" fill="#92400e" text-anchor="middle">AGENT 8 • MCDA COGNITIVE ENGINE</text>

      <text x="210" y="15" font-size="13" font-weight="900" fill="#0f172a">Dilemma Formulation</text>
      
      <!-- Dilemma Input Field -->
      <rect x="0" y="32" width="940" height="38" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
      <text x="14" y="56" font-size="13" font-weight="700" fill="#0f172a">Should I push through to finish the quarterly sprint report tonight, or stop now and recover baseline energy?</text>

      <!-- Re-evaluate Button -->
      <rect x="955" y="32" width="155" height="38" rx="8" fill="#6366f1" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow-sm)" />
      <text x="1032" y="56" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">✨ Re-Evaluate MCDA</text>
    </g>
  </g>

  <!-- Left: Quantitative Multi-Criteria Decision Analysis (MCDA) Table (Width: 680) -->
  <g transform="translate(24, 252)">
    <rect x="0" y="0" width="700" height="375" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow)" />
    <g transform="translate(20, 20)">
      <text x="0" y="16" font-size="15" font-weight="900" fill="#0f172a">📊 Quantitative Multi-Criteria Scoring (MCDA)</text>
      <text x="0" y="34" font-size="11" font-weight="500" fill="#64748b">Criterion weighting accounts for executive drain, reversibility, values, and regret.</text>

      <!-- Table Header -->
      <rect x="0" y="48" width="660" height="32" rx="6" fill="#0f172a" />
      <text x="14" y="68" font-size="10" font-weight="800" fill="#ffffff">COMPETING OPTION</text>
      <text x="260" y="68" font-size="10" font-weight="800" fill="#cbd5e1" text-anchor="middle">ENERGY (x1.2)</text>
      <text x="350" y="68" font-size="10" font-weight="800" fill="#cbd5e1" text-anchor="middle">REVERS. (x1.0)</text>
      <text x="440" y="68" font-size="10" font-weight="800" fill="#cbd5e1" text-anchor="middle">VALUES (x1.5)</text>
      <text x="530" y="68" font-size="10" font-weight="800" fill="#cbd5e1" text-anchor="middle">REGRET (x1.3)</text>
      <text x="615" y="68" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">WEIGHTED</text>

      <!-- Row 1: Option A (Maximizing) -->
      <rect x="0" y="86" width="660" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="14" y="108" font-size="12" font-weight="800" fill="#0f172a">Option A: Push through tonight</text>
      <text x="14" y="124" font-size="10" font-weight="600" fill="#ef4444">Maximizing Trap (High Burnout Risk)</text>
      <text x="260" y="116" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">2/5</text>
      <text x="350" y="116" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">3/5</text>
      <text x="440" y="116" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">4/5</text>
      <text x="530" y="116" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">3/5</text>
      <text x="615" y="116" font-size="14" font-weight="900" fill="#64748b" text-anchor="middle">16.2 / 25</text>

      <!-- Row 2: Option B (Full Stop) -->
      <rect x="0" y="144" width="660" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="14" y="166" font-size="12" font-weight="800" fill="#0f172a">Option B: Stop now &amp; sleep</text>
      <text x="14" y="182" font-size="10" font-weight="600" fill="#059669">Self-Care Focus (Inertia Risk Tomorrow)</text>
      <text x="260" y="174" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">5/5</text>
      <text x="350" y="174" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">5/5</text>
      <text x="440" y="174" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">4/5</text>
      <text x="530" y="174" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">3/5</text>
      <text x="615" y="174" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">20.8 / 25</text>

      <!-- Row 3: Option C (WINNER - Satisficing) -->
      <rect x="0" y="202" width="660" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <rect x="14" y="214" width="80" height="18" rx="4" fill="#10b981" />
      <text x="54" y="227" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">RECOMMENDED</text>
      <text x="102" y="228" font-size="13" font-weight="900" fill="#065f46">Option C: 15-Minute Low-Stakes Trial + Shutdown</text>
      <text x="14" y="250" font-size="11" font-weight="600" fill="#047857">Herbert Simon Satisficing Anchor • Breaks inertia while protecting sleep baseline</text>
      <text x="260" y="238" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle">4/5</text>
      <text x="350" y="238" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle">5/5</text>
      <text x="440" y="238" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle">5/5</text>
      <text x="530" y="238" font-size="13" font-weight="900" fill="#065f46" text-anchor="middle">5/5</text>
      <text x="615" y="240" font-size="17" font-weight="900" fill="#059669" text-anchor="middle">23.2 / 25</text>

      <!-- Reversibility Lens Callout -->
      <rect x="0" y="280" width="660" height="65" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
      <text x="14" y="302" font-size="11" font-weight="900" fill="#3730a3">🚪 TWO-WAY DOOR DECISION CLASSIFICATION (Jeff Bezos Principle)</text>
      <text x="14" y="322" font-size="11" font-weight="600" fill="#312e81">This is a Type 2 reversible decision. You do not need to solve the whole sprint tonight. A 15-minute trial has zero downside and 100% rollback flexibility.</text>
    </g>
  </g>

  <!-- Right: Psychological Insights & Minimum Viable Commitment (Width: 430) -->
  <g transform="translate(744, 252)">
    <rect x="0" y="0" width="432" height="375" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow)" />
    <g transform="translate(20, 20)">
      <text x="0" y="16" font-size="15" font-weight="900" fill="#0f172a">🧠 Psychological Lenses (W.R.A.P.)</text>

      <!-- 10/10/10 Rule -->
      <rect x="0" y="32" width="392" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="12" y="50" font-size="11" font-weight="800" fill="#0f172a">🔮 The 10/10/10 Rule (Suzy Welch)</text>
      <text x="12" y="68" font-size="10" font-weight="600" fill="#475569">• In 10 Minutes: Instant relief from dread of an all-nighter.</text>
      <text x="12" y="84" font-size="10" font-weight="600" fill="#475569">• In 10 Months: You will remember self-regulation, not 1 hr.</text>
      <text x="12" y="100" font-size="10" font-weight="600" fill="#475569">• In 10 Years: Strengthens compassionate executive pacing.</text>

      <!-- Somatic Gut Check -->
      <rect x="0" y="116" width="392" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="12" y="134" font-size="11" font-weight="900" fill="#92400e">🪙 Somatic Gut Check (Antonio Damasio)</text>
      <text x="12" y="152" font-size="10" font-weight="600" fill="#78350f">If a coin forced you to work until 3 AM right now, does your chest tighten? Trust that somatic marker.</text>

      <!-- Minimum Viable Commitment (MVC) Box -->
      <rect x="0" y="190" width="392" height="135" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow-sm)" />
      <g transform="translate(14, 206)">
        <text x="0" y="14" font-size="13" font-weight="900" fill="#14532d">🎯 Minimum Viable Commitment (MVC)</text>
        <text x="0" y="36" font-size="11" font-weight="700" fill="#166534">"Open report, outline 3 bullet points for 15 minutes, then close laptop and sleep."</text>
        <text x="0" y="56" font-size="10" font-weight="600" fill="#15803d">Zero decision fatigue remaining. Single physical step defined.</text>

        <!-- Hand-off to Micro Planner Button -->
        <rect x="0" y="74" width="364" height="34" rx="8" fill="#15803d" stroke="#0f172a" stroke-width="1.5" />
        <text x="182" y="96" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">Transfer MVC to Micro-Planner →</text>
      </g>
    </g>
  </g>

  <!-- Footer Info Bar -->
  <rect x="0" y="645" width="1200" height="30" fill="#0f172a" />
  <text x="24" y="665" font-size="11" font-weight="600" fill="#94a3b8">Decision Matrix &amp; Advisor • Herbert Simon Bounded Rationality • Suzy Welch 10/10/10 • Jeff Bezos Two-Way Door</text>
</svg>
